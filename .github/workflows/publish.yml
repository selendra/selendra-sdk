name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish"
        required: true
        default: "sdk"
        type: choice
        options:
          - sdk
          - cli
          - all
      dry-run:
        description: "Dry run (do not actually publish)"
        required: false
        default: false
        type: boolean

jobs:
  publish-sdk:
    name: Publish @selendrajs/sdk
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && (inputs.package == 'sdk' || inputs.package == 'all'))

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build SDK
        run: npm run build -w @selendrajs/sdk

      - name: Run tests
        run: npm run test -w @selendrajs/sdk

      - name: Generate documentation
        run: npm run docs -w @selendrajs/sdk

      - name: Publish to npm (dry run)
        if: inputs.dry-run == true
        run: npm publish --dry-run -w @selendrajs/sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        if: inputs.dry-run != true
        run: npm publish --provenance --access public -w @selendrajs/sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-cli:
    name: Publish @selendrajs/cli
    runs-on: ubuntu-latest
    needs: publish-sdk
    if: |
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && (inputs.package == 'cli' || inputs.package == 'all'))

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build SDK first
        run: npm run build -w @selendrajs/sdk

      - name: Build CLI
        run: npm run build -w @selendrajs/cli

      - name: Publish to npm (dry run)
        if: inputs.dry-run == true
        run: npm publish --dry-run -w @selendrajs/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        if: inputs.dry-run != true
        run: npm publish --provenance --access public -w @selendrajs/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  create-github-release:
    name: Create GitHub Release Notes
    runs-on: ubuntu-latest
    needs: [publish-sdk, publish-cli]
    if: github.event_name == 'release'

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update release notes
        uses: softprops/action-gh-release@v1
        with:
          append_body: true
          body: |

            ## 📦 npm Packages

            - [@selendrajs/sdk](https://www.npmjs.com/package/@selendrajs/sdk)
            - [@selendrajs/cli](https://www.npmjs.com/package/@selendrajs/cli)

            ## 🚀 Installation

            ```bash
            npm install @selendrajs/sdk
            npm install -g @selendrajs/cli
            ```
